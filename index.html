<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coway Core Plus — Hotel NEO+ Penang</title>
<link rel="icon" href="https://static.neohotels.com/v3/assets/img/favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cw:#C8B8A0;--dk:#2D2D2D;--md:#6B6B6B;--lt:#F5F0EA;--bg:#FAFAF7;--wh:#fff;--ac:#E8553A;--gn:#4CAF50;--am:#F5A623;--bl:#4A90D9}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--dk);line-height:1.6;overflow-x:hidden}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:var(--dk);color:#fff;z-index:100;transform:translateX(-260px);transition:transform .25s;display:flex;flex-direction:column;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none}.overlay.show{display:block}
.sb-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-brand{font-size:10px;letter-spacing:3px;opacity:.4;text-transform:uppercase}
.sb-hotel{font-size:15px;font-weight:700;margin-top:4px}
.sb-model{font-size:11px;opacity:.5;margin-top:2px;font-family:monospace}
.sb-nav{flex:1;padding:6px 0}
.sb-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:transparent;border:none;border-left:3px solid transparent;color:rgba(255,255,255,.55);cursor:pointer;font-size:14px;text-align:left;transition:all .15s;font-family:inherit}
.sb-btn:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8)}
.sb-btn.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--ac)}
.sb-btn .icon{font-size:16px;width:24px;text-align:center}
.sb-langs{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1)}
.sb-langs-label{font-size:10px;opacity:.3;margin-bottom:6px;letter-spacing:1px}
.lbtn{padding:4px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:11px;cursor:pointer;margin:2px}
.lbtn.active{border-color:var(--ac);background:rgba(232,85,58,.2)}
.topbar{background:var(--dk);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.menu-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px}
.topbar-title{flex:1;font-size:14px;font-weight:600}
.topbar .lbtn{padding:3px 7px;border:none;background:rgba(255,255,255,.12);font-size:10px;margin-left:2px}
.topbar .lbtn.active{background:var(--ac);font-weight:700}
.main{max-width:880px;margin:0 auto;padding:20px 16px 60px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--cw)}
.sec-num{width:34px;height:34px;background:var(--dk);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.sec-h h2{font-size:20px;font-weight:700}
.card{background:var(--wh);border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(0,0,0,.03)}
.card h3{font-size:16px;font-weight:700;margin-bottom:10px}
.alert{border-radius:10px;padding:14px 18px;margin:12px 0;display:flex;gap:10px;font-size:14px;line-height:1.6;align-items:flex-start}
.alert .ai{font-size:18px;flex-shrink:0}
.alert.info{background:#E3F2FD;border:1px solid #90CAF9;color:#1565C0}
.alert.warn{background:#FFF8E1;border:1px solid #FFE082;color:#8D6E00}
.alert.danger{background:#FFEBEE;border:1px solid #EF9A9A;color:#C62828}
.alert.ok{background:#E8F5E9;border:1px solid #A5D6A7;color:#2E7D32}
.panel{background:var(--cw);border-radius:16px;padding:28px 20px;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.panel-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--dk);opacity:.6;margin-bottom:20px}
.panel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pb{background:rgba(255,255,255,.15);border-radius:12px;padding:16px 6px 12px;text-align:center;position:relative}
.pb.hl{background:rgba(255,255,255,.35);outline:2px solid var(--ac);outline-offset:2px}
.pb.hlg{background:rgba(255,255,255,.35);outline:2px solid var(--gn);outline-offset:2px}
.pb svg{width:36px;height:36px;margin:0 auto 6px;display:block}
.pb .lbl{font-size:11px;font-weight:600}.pb .sub{font-size:9px;color:var(--md)}
.ind{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.15);margin:0 auto 6px}.ind.on{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.6)}
.leds{display:flex;flex-direction:column;gap:3px;position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.leds .dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.15)}.leds .dot.on{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.6)}
/* Amount indicators */
.amt-ind{position:absolute;right:6px;top:14px;display:flex;flex-direction:column;gap:2px;font-size:8px;font-weight:600;color:var(--dk);opacity:.7;text-align:right}
.amt-ind div{display:flex;align-items:center;gap:3px;justify-content:flex-end}
.amt-ind .adot{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.25)}
.amt-ind .adot.on{background:#fff;box-shadow:0 0 4px rgba(255,255,255,.5)}
.led-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.led-card{background:var(--lt);border-radius:10px;padding:14px;text-align:center}
.led-card .dots{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.12);border:1.5px solid rgba(0,0,0,.1);display:inline-block}
.dot.g{background:var(--gn);border-color:var(--gn);box-shadow:0 0 8px rgba(76,175,80,.4)}
.dot.r{background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px rgba(232,85,58,.4);animation:pulse 1s infinite}
.dot.b{background:var(--bl);border-color:var(--bl);box-shadow:0 0 8px rgba(74,144,217,.4);animation:pulse 1s infinite}
.led-card .desc{font-size:12px;font-weight:600}
.step{display:flex;gap:16px}.step-rail{display:flex;flex-direction:column;align-items:center;width:44px;flex-shrink:0}
.step-circ{width:44px;height:44px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;z-index:1;flex-shrink:0}
.step-line{width:2px;flex:1;background:rgba(0,0,0,.1);min-height:16px}
.step-card{flex:1;background:var(--wh);border-radius:12px;padding:18px 20px;margin-bottom:14px;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(0,0,0,.03)}
.step-card h3{font-size:15px;font-weight:700;margin-bottom:4px}.step-card p{font-size:14px;color:var(--md)}
.yn{border-radius:10px;padding:10px 14px;margin:6px 0;background:var(--wh)}
.yn.y{border:2px solid var(--gn);border-left-width:4px}.yn.n{border:2px solid var(--ac);border-left-width:4px}
.yn .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:3px;margin-right:6px}
.yn.y .tag{background:#E8F5E9;color:#2E7D32}.yn.n .tag{background:#FFEBEE;color:#C62828}
.yn span:last-child{font-size:14px;color:var(--md)}
.itag{display:inline-flex;align-items:center;gap:4px;background:var(--lt);padding:2px 8px;border-radius:4px;font-weight:600;font-size:13px}
.rtbl{width:100%;border-collapse:separate;border-spacing:0;border-radius:10px;overflow:hidden;margin:12px 0;font-size:14px}
.rtbl th{background:var(--dk);color:#fff;padding:10px 14px;text-align:left;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.rtbl td{padding:10px 14px;border-bottom:1px solid rgba(0,0,0,.06);vertical-align:top}
.rtbl tr:nth-child(even) td{background:var(--lt)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--wh);border-radius:12px;padding:16px;text-align:center;border:1px solid rgba(0,0,0,.06);cursor:pointer;transition:transform .15s}
.stat:hover{transform:translateY(-2px)}.stat .val{font-size:28px;font-weight:700;font-family:monospace}.stat .lbl{font-size:11px;color:var(--md);margin-top:4px}
.err-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.err-card{background:var(--wh);border-radius:10px;padding:16px;border:1px solid rgba(0,0,0,.06)}
.err-card h4{font-size:14px;font-weight:700;color:var(--ac);margin-bottom:6px}
.err-card p{font-size:13px;color:var(--md);margin-bottom:8px}.err-card .edots{display:flex;gap:4px}
.dcard{background:linear-gradient(135deg,#2D2D2D,#3A3A3A);color:#fff;border-radius:12px;padding:24px;margin-bottom:16px}
.dl-link{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--lt);border-radius:8px;text-decoration:none;color:var(--dk);margin-bottom:8px;transition:background .15s}
.dl-link:hover{background:#e8e0d4}
@media(max-width:640px){.panel-grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.err-grid{grid-template-columns:1fr}.led-row{grid-template-columns:repeat(2,1fr)}}
@media print{.topbar,.sidebar,.overlay{display:none!important}}
</style>
</head>

<script>
let P='home',L='en';
const LANGS={en:'English',ms:'B.Melayu',zh:'中文',ne:'नेपाली',bn:'বাংলা'};
const PAGES=[{id:'home',icon:'📊',k:'navHome'},{id:'panel',icon:'🎛️',k:'navPanel'},{id:'hot',icon:'🔥',k:'navHot'},{id:'cold',icon:'❄️',k:'navCold'},{id:'flood',icon:'🌊',k:'navFlood'},{id:'error',icon:'⚠️',k:'navError'},{id:'guest',icon:'👤',k:'navGuest'},{id:'specs',icon:'📋',k:'navSpecs'}];

// ═══ ALL TRANSLATIONS — EVERY STRING ═══
const T={
navHome:{en:"Dashboard",ms:"Papan Pemuka",zh:"仪表板",ne:"ड्यासबोर्ड",bn:"ড্যাশবোর্ড"},
navPanel:{en:"Control Panel",ms:"Panel Kawalan",zh:"控制面板",ne:"कन्ट्रोल प्यानल",bn:"কন্ট্রোল প্যানেল"},
navHot:{en:"Hot Water Issue",ms:"Masalah Air Panas",zh:"热水问题",ne:"तातो पानी समस्या",bn:"গরম পানি সমস্যা"},
navCold:{en:"Cold & Ambient",ms:"Sejuk & Ambient",zh:"冷水/常温水",ne:"चिसो/Ambient",bn:"ঠান্ডা/সাধারণ"},
navFlood:{en:"Flooding",ms:"Banjir Air",zh:"溢水紧急",ne:"बाढी",bn:"বন্যা"},
navError:{en:"Error Codes",ms:"Kod Ralat",zh:"错误代码",ne:"त्रुटि कोड",bn:"ত্রুটি কোড"},
navGuest:{en:"Guest Help",ms:"Bantuan Tetamu",zh:"客人帮助",ne:"अतिथि सहायता",bn:"অতিথি সাহায্য"},
navSpecs:{en:"Specs & Downloads",ms:"Spesifikasi & Muat Turun",zh:"规格与下载",ne:"विशिष्टता र डाउनलोड",bn:"স্পেসিফিকেশন"},
topIssue:{en:"#1 Issue at Hotel NEO+: No Hot Water from Coway dispenser",ms:"#1 Masalah di Hotel NEO+: Tiada Air Panas dari mesin Coway",zh:"NEO+酒店#1问题：Coway饮水机没有热水",ne:"#1 समस्या: Coway बाट तातो पानी छैन",bn:"#1 সমস্যা: Coway থেকে গরম পানি আসছে না"},
hotelInfo:{en:"14 guest floors • 196 rooms • All guest floors have Coway dispensers",ms:"14 tingkat tetamu • 196 bilik • Semua tingkat ada mesin Coway",zh:"14个客房楼层 • 196间客房 • 所有楼层配备Coway饮水机",ne:"१४ अतिथि तला • १९६ कोठा • सबै तलामा Coway छ",bn:"১৪ অতিথি তলা • ১৯৬ কক্ষ • সব তলায় Coway আছে"},
callCoway:{en:"If issue persists → Coway Careline: 1800-88-111",ms:"Jika masalah berterusan → Coway Careline: 1800-88-111",zh:"问题持续 → Coway热线：1800-88-111",ne:"समस्या जारी भए → Coway: 1800-88-111",bn:"সমস্যা চলমান থাকলে → Coway: 1800-88-111"},
doNotRepair:{en:"Do NOT open or disassemble. Call Coway for all repairs.",ms:"JANGAN buka atau bongkar unit. Hubungi Coway untuk semua pembaikan.",zh:"请勿打开或拆卸设备。所有维修请致电Coway。",ne:"मेसिन नखोल्नुहोस्। सबै मर्मतको लागि Coway फोन गर्नुहोस्।",bn:"ইউনিট খুলবেন বা বিচ্ছিন্ন করবেন না। সব মেরামতের জন্য Coway কল করুন।"},
panelFront:{en:"Control Panel — Front View",ms:"Panel Kawalan — Pandangan Hadapan",zh:"控制面板 — 正面视图",ne:"कन्ट्रोल प्यानल — अगाडिको दृश्य",bn:"কন্ট্রোল প্যানেল — সামনের দৃশ্য"},
panelDesc:{en:"Red-highlighted buttons are checked for hot water issues. Heater: 530W–660W.",ms:"Butang bertanda merah diperiksa untuk masalah air panas. Pemanas: 530W–660W.",zh:"红色标记的按钮用于排查热水问题。加热器功率：530W–660W。",ne:"रातो बटनहरू तातो पानी जाँचको लागि हो। हिटर: 530W–660W।",bn:"লাল চিহ্নিত বোতামগুলি গরম পানি সমস্যার জন্য পরীক্ষা করা হয়। হিটার: 530W–660W।"},
ledTitle:{en:"Understanding the Hot Water LEDs",ms:"Memahami LED Air Panas",zh:"了解热水LED指示灯",ne:"तातो पानी LED बुझ्नुहोस्",bn:"গরম পানি LED বুঝুন"},
ledDesc:{en:"The 3 LED dots next to the Hot button show the current temperature inside the 3.6L hot water tank.",ms:"3 titik LED di sebelah butang Hot menunjukkan suhu semasa dalam tangki air panas 3.6L.",zh:"Hot按钮旁的3个LED点显示3.6L热水箱内的当前温度。",ne:"Hot बटन छेउको ३ LED ले 3.6L तातो पानी ट्यांकको हालको तापमान देखाउँछ।",bn:"Hot বোতামের পাশের ৩টি LED 3.6L গরম পানির ট্যাংকের বর্তমান তাপমাত্রা দেখায়।"},
ledKey:{en:"When guests use lots of hot water, the tank empties and LEDs drop 3→2→1. This is a storage heating type — takes 10–20 min to reheat. All 3 LEDs must be lit before hot water is ready.",ms:"Apabila tetamu guna banyak air panas, tangki kosong dan LED menurun 3→2→1. Ini jenis pemanasan simpanan — mengambil 10–20 minit untuk panas semula. Ketiga-tiga LED mesti menyala sebelum air panas sedia.",zh:"当客人大量使用热水后，水箱排空，LED从3→2→1递减。这是储热式设备，需要10–20分钟重新加热。3个LED全部亮起后热水才可用。",ne:"अतिथिले धेरै तातो पानी प्रयोग गर्दा ट्यांक खाली हुन्छ र LED 3→2→1 घट्छ। यो storage heating हो — पुनः तताउन 10–20 मिनेट लाग्छ। ३ LED बल्दा मात्र तातो पानी तयार हुन्छ।",bn:"অতিথি বেশি গরম পানি ব্যবহার করলে ট্যাংক খালি হয় এবং LED 3→2→1 কমে। এটি storage heating — পুনরায় গরম করতে ১০–২০ মিনিট লাগে। ৩টি LED জ্বলার পরেই গরম পানি প্রস্তুত।"},
ledOff:{en:"All OFF — Function disabled",ms:"Semua MATI — Fungsi dilumpuhkan",zh:"全灭 — 功能已关闭",ne:"सबै बन्द — कार्य बन्द",bn:"সব বন্ধ — ফাংশন অক্ষম"},
led1:{en:"1 LED — Weak (heating)",ms:"1 LED — Lemah (memanaskan)",zh:"1个LED — 弱（加热中）",ne:"१ LED — कमजोर (तताउँदै)",bn:"১ LED — দুর্বল (গরম হচ্ছে)"},
led2:{en:"2 LEDs — Mild (almost)",ms:"2 LED — Sederhana (hampir sedia)",zh:"2个LED — 中（即将就绪）",ne:"२ LED — मध्यम (लगभग तयार)",bn:"২ LED — মাঝারি (প্রায় তৈরি)"},
led3:{en:"3 LEDs — READY ✓ (≥80°C)",ms:"3 LED — SEDIA ✓ (≥80°C)",zh:"3个LED — 就绪 ✓（≥80°C）",ne:"३ LED — तयार ✓ (≥80°C)",bn:"৩ LED — তৈরি ✓ (≥80°C)"},
// Cold LEDs
coldLedTitle:{en:"Cold Water LEDs",ms:"LED Air Sejuk",zh:"冷水LED指示灯",ne:"चिसो पानी LED",bn:"ঠান্ডা পানি LED"},
coldLedDesc:{en:"The 3 LED dots next to the Cold button show the cold water temperature in the 7.1L cold water tank.",ms:"3 titik LED di sebelah butang Cold menunjukkan suhu air sejuk dalam tangki 7.1L.",zh:"Cold按钮旁的3个LED显示7.1L冷水箱的冷水温度。",ne:"Cold बटन छेउको ३ LED ले 7.1L चिसो पानी ट्यांकको तापमान देखाउँछ।",bn:"Cold বোতামের পাশের ৩টি LED 7.1L ঠান্ডা পানির ট্যাংকের তাপমাত্রা দেখায়।"},
cled1:{en:"1 LED — Slightly cool",ms:"1 LED — Sedikit sejuk",zh:"1个LED — 微冷",ne:"१ LED — अलिकति चिसो",bn:"১ LED — সামান্য ঠান্ডা"},
cled2:{en:"2 LEDs — Moderately cold",ms:"2 LED — Sederhana sejuk",zh:"2个LED — 较冷",ne:"२ LED — मध्यम चिसो",bn:"২ LED — মাঝারি ঠান্ডা"},
cled3:{en:"3 LEDs — Coldest ✓",ms:"3 LED — Paling sejuk ✓",zh:"3个LED — 最冷 ✓",ne:"३ LED — सबैभन्दा चिसो ✓",bn:"৩ LED — সবচেয়ে ঠান্ডা ✓"},
coldLedNote:{en:"Takes ~2 hours to reach full cold after turning on. Cold water function must be enabled (hold Cold 3 sec).",ms:"Mengambil ~2 jam untuk mencapai sejuk penuh selepas dihidupkan. Fungsi air sejuk mesti diaktifkan (tahan Cold 3 saat).",zh:"开启后约需2小时达到最冷。冷水功能需先启用（按住Cold 3秒）。",ne:"सुरु गरेपछि पूर्ण चिसो हुन ~२ घण्टा लाग्छ। Cold कार्य सक्रिय हुनुपर्छ (Cold ३ सेकेन्ड)।",bn:"চালু করার পর সম্পূর্ণ ঠান্ডা হতে ~২ ঘণ্টা লাগে। Cold ফাংশন সক্রিয় থাকতে হবে (Cold ৩ সেকেন্ড)।"},
// Other indicators
otherIndTitle:{en:"Other Panel Indicators",ms:"Penunjuk Panel Lain",zh:"其他面板指示灯",ne:"अन्य प्यानल सूचकहरू",bn:"অন্যান্য প্যানেল সূচক"},
uvInd:{en:"UV Care indicator",ms:"Penunjuk UV Care",zh:"UV Care 指示灯",ne:"UV Care सूचक",bn:"UV Care সূচক"},
uvIndDesc:{en:"Lights up when UV sterilization is running inside the water tank. This happens automatically — no action needed.",ms:"Menyala apabila pensterilan UV sedang berjalan dalam tangki air. Ini berlaku secara automatik — tiada tindakan diperlukan.",zh:"水箱内UV消毒运行时亮起。此过程自动进行，无需操作。",ne:"पानी ट्यांक भित्र UV स्टेरिलाइजेसन चल्दा बल्छ। यो स्वचालित हुन्छ — कुनै कार्य आवश्यक छैन।",bn:"ওয়াটার ট্যাংকে UV জীবাণুনাশন চলার সময় জ্বলে। এটি স্বয়ংক্রিয়ভাবে হয় — কোনো পদক্ষেপের দরকার নেই।"},
lowInd:{en:"Low Water indicator",ms:"Penunjuk Low Water",zh:"低水位指示灯",ne:"Low Water सूचक",bn:"Low Water সূচক"},
lowIndDesc:{en:"Lights up when the water level in the tank is low. Check that the tap water valve and hand valve are open, and hoses are not kinked.",ms:"Menyala apabila paras air dalam tangki rendah. Periksa injap air paip dan injap tangan dibuka, dan hos tidak bengkok.",zh:"水箱水位低时亮起。检查水龙头阀和手动阀是否打开，软管是否弯折。",ne:"ट्यांकमा पानीको स्तर कम हुँदा बल्छ। नल भल्भ र ह्यान्ड भल्भ खुला छ र पाइप बाँकिएको छैन जाँच गर्नुहोस्।",bn:"ট্যাংকে পানির স্তর কম হলে জ্বলে। ট্যাপ ভালভ ও হ্যান্ড ভালভ খোলা এবং পাইপ বাঁকা নয় কিনা পরীক্ষা করুন।"},
amtInd:{en:"Amount indicators (∞ / 1L / 0.5L)",ms:"Penunjuk Jumlah (∞ / 1L / 0.5L)",zh:"水量指示灯（∞ / 1L / 0.5L）",ne:"मात्रा सूचक (∞ / 1L / 0.5L)",bn:"পরিমাণ সূচক (∞ / 1L / 0.5L)"},
amtIndDesc:{en:"Shows the selected water extraction amount. Press the Amount button to cycle: 0.5L → 1L → Continuous (∞) → OFF. If no amount is selected, water flows only while you hold the lever.",ms:"Menunjukkan jumlah air yang dipilih. Tekan butang Amount untuk kitaran: 0.5L → 1L → Berterusan (∞) → MATI. Jika tiada jumlah dipilih, air mengalir hanya semasa anda menekan tuil.",zh:"显示已选择的出水量。按Amount按钮循环：0.5L → 1L → 连续(∞) → 关闭。如未选择水量，仅在按住把手时出水。",ne:"छानिएको पानी मात्रा देखाउँछ। Amount बटन थिच्नुहोस्: 0.5L → 1L → लगातार (∞) → बन्द। मात्रा नछानेमा लिभर थिच्दा मात्र पानी आउँछ।",bn:"নির্বাচিত পানির পরিমাণ দেখায়। Amount বোতাম চাপুন: 0.5L → 1L → অবিরত (∞) → বন্ধ। পরিমাণ নির্বাচন না করলে লিভার ধরে রাখলেই পানি আসে।"},
funcDots:{en:"Function indicator dots",ms:"Titik penunjuk fungsi",zh:"功能指示点",ne:"कार्य सूचक बत्तीहरू",bn:"ফাংশন সূচক বিন্দু"},
funcDotsDesc:{en:"Each button has a small dot above it. When the dot is lit, that function is active. Hot and Cold dots mean those functions are enabled. Ambient dot means ambient water is selected.",ms:"Setiap butang mempunyai titik kecil di atasnya. Apabila titik menyala, fungsi itu aktif. Titik Hot dan Cold bermakna fungsi tersebut diaktifkan. Titik Ambient bermakna air ambient dipilih.",zh:"每个按钮上方有一个小指示点。当该点亮起时表示该功能处于活动状态。Hot和Cold的点表示这些功能已启用。Ambient的点表示已选择常温水。",ne:"हरेक बटन माथि सानो बत्ती छ। बत्ती बल्दा त्यो कार्य सक्रिय छ। Hot र Cold बत्ती बल्दा ती कार्यहरू सक्षम छन्। Ambient बत्ती बल्दा ambient पानी छानिएको छ।",bn:"প্রতিটি বোতামের উপরে একটি ছোট বিন্দু আছে। বিন্দু জ্বললে সেই ফাংশন সক্রিয়। Hot ও Cold বিন্দু মানে সেই ফাংশন সক্ষম। Ambient বিন্দু মানে সাধারণ পানি নির্বাচিত।"},
btnTiming:{en:"Button Timing Cheat Sheet",ms:"Rujukan Pantas Masa Butang",zh:"按钮操作时间速查表",ne:"बटन समय सन्दर्भ तालिका",bn:"বোতাম সময় রেফারেন্স"},
actOn:{en:"Turn ON hot/cold",ms:"Hidupkan air panas/sejuk",zh:"开启热水/冷水",ne:"तातो/चिसो सुरु गर्नुहोस्",bn:"গরম/ঠান্ডা চালু করুন"},
actOff:{en:"Turn OFF hot/cold",ms:"Matikan air panas/sejuk",zh:"关闭热水/冷水",ne:"तातो/चिसो बन्द गर्नुहोस्",bn:"গরম/ঠান্ডা বন্ধ করুন"},
actLock:{en:"Toggle Hot Lock",ms:"Tukar Hot Lock hidup/mati",zh:"切换热水锁开/关",ne:"Hot Lock खोल्नुहोस्/बन्द गर्नुहोस्",bn:"Hot Lock চালু/বন্ধ করুন"},
actAmb:{en:"Select Ambient water",ms:"Pilih air Ambient",zh:"选择常温水",ne:"Ambient पानी छान्नुहोस्",bn:"Ambient পানি নির্বাচন করুন"},
hold3:{en:"3 sec hold",ms:"Tahan 3 saat",zh:"按住3秒",ne:"३ सेकेन्ड थिच्नुहोस्",bn:"৩ সেকেন্ড ধরুন"},
hold7:{en:"7 sec hold",ms:"Tahan 7 saat",zh:"按住7秒",ne:"७ सेकेन्ड थिच्नुहोस्",bn:"৭ সেকেন্ড ধরুন"},
tapQ:{en:"Quick tap",ms:"Ketuk pantas",zh:"快按一下",ne:"छिटो थिच्नुहोस्",bn:"দ্রুত ট্যাপ করুন"},
action:{en:"Action",ms:"Tindakan",zh:"操作",ne:"कार्य",bn:"কাজ"},
button:{en:"Button",ms:"Butang",zh:"按钮",ne:"बटन",bn:"বোতাম"},

// Hot water steps
s1t:{en:"Check if Hot indicator is ON",ms:"Periksa sama ada penunjuk Hot MENYALA",zh:"检查Hot指示灯是否亮起",ne:"Hot बत्ती बलेको छ कि छैन जाँच गर्नुहोस्",bn:"Hot সূচক চালু আছে কিনা পরীক্ষা করুন"},
s1q:{en:"Look at the Hot button — is the indicator dot above it lit?",ms:"Lihat butang Hot — adakah titik penunjuk di atasnya menyala?",zh:"查看Hot按钮——上方的指示点是否亮着？",ne:"Hot बटन हेर्नुहोस् — माथिको बत्ती बलेको छ?",bn:"Hot বোতামটি দেখুন — উপরের সূচক বিন্দুটি জ্বলছে কি?"},
s1no:{en:"OFF → Press & hold Hot button 3 seconds to turn ON",ms:"MATI → Tekan & tahan butang Hot 3 saat untuk hidupkan",zh:"未亮 → 按住Hot按钮3秒开启",ne:"बन्द → Hot बटन ३ सेकेन्ड थिचेर सुरु गर्नुहोस्",bn:"বন্ধ → Hot বোতাম ৩ সেকেন্ড চেপে ধরে চালু করুন"},
s1yes:{en:"ON → Proceed to Step 2",ms:"MENYALA → Teruskan ke Langkah 2",zh:"已亮 → 继续步骤2",ne:"बलेको → चरण २ मा जानुहोस्",bn:"চালু → ধাপ ২ এ যান"},
s2t:{en:"Check the Hot Lock indicator",ms:"Periksa penunjuk Hot Lock",zh:"检查热水锁指示灯",ne:"Hot Lock बत्ती जाँच गर्नुहोस्",bn:"Hot Lock সূচক পরীক্ষা করুন"},
s2q:{en:"Is the Hot Lock indicator lit? If yes, hot water is DISABLED.",ms:"Adakah penunjuk Hot Lock menyala? Jika ya, air panas DILUMPUHKAN.",zh:"Hot Lock指示灯是否亮着？如果是，热水已被禁用。",ne:"Hot Lock बत्ती बलेको छ? बलेको भए तातो पानी बन्द छ।",bn:"Hot Lock সূচক জ্বলছে? হ্যাঁ হলে গরম পানি অক্ষম আছে।"},
s2lock:{en:"Lock ON → Hold Hot Lock 3 sec to unlock",ms:"Kunci AKTIF → Tekan & tahan Hot Lock 3 saat untuk membuka kunci",zh:"锁已开启 → 按住Hot Lock 3秒解锁",ne:"लक अन → Hot Lock ३ सेकेन्ड थिचेर खोल्नुहोस्",bn:"লক চালু → Hot Lock ৩ সেকেন্ড ধরে আনলক করুন"},
s2ok:{en:"Lock OFF → Good, proceed to Step 3",ms:"Kunci MATI → Baik, teruskan ke Langkah 3",zh:"锁已关闭 → 好的，继续步骤3",ne:"लक बन्द → राम्रो, चरण ३ मा जानुहोस्",bn:"লক বন্ধ → ভালো, ধাপ ৩ এ যান"},
s3t:{en:"Count the 3 Temperature LEDs",ms:"Kira 3 LED Suhu",zh:"数一下3个温度LED",ne:"३ वटा तापमान LED गन्नुहोस्",bn:"৩টি তাপমাত্রা LED গণনা করুন"},
s3wait:{en:"1-2 LEDs → Tank reheating. Wait 10-20 minutes for all 3 LEDs to light up",ms:"1-2 LED → Tangki sedang dipanaskan semula. Tunggu 10-20 minit sehingga ketiga-tiga LED menyala",zh:"1-2个LED → 水箱正在重新加热。等待10-20分钟直到3个LED全亮",ne:"१-२ LED → ट्यांक तताउँदैछ। ३ LED बल्न 10-20 मिनेट पर्खनुहोस्",bn:"১-২ LED → ট্যাংক গরম হচ্ছে। ৩টি LED জ্বলার জন্য ১০-২০ মিনিট অপেক্ষা করুন"},
s3go:{en:"3 LEDs lit ✓ → Hot water ready! Test with LEFT lever within 7 seconds",ms:"3 LED menyala ✓ → Air panas sedia! Uji dengan tuil KIRI dalam masa 7 saat",zh:"3个LED全亮 ✓ → 热水已就绪！7秒内用左侧把手测试出水",ne:"३ LED बलेको ✓ → तातो पानी तयार! ७ सेकेन्डभित्र बायाँ लिभरले परीक्षण गर्नुहोस्",bn:"৩ LED জ্বলছে ✓ → গরম পানি তৈরি! ৭ সেকেন্ডের মধ্যে বাম লিভার দিয়ে পরীক্ষা করুন"},
s4t:{en:"Check Low Water & Power Supply",ms:"Periksa Penunjuk Low Water & Bekalan Kuasa",zh:"检查低水位指示和电源",ne:"Low Water र बिजुली आपूर्ति जाँच गर्नुहोस्",bn:"Low Water ও বিদ্যুৎ সরবরাহ পরীক্ষা করুন"},
s4d:{en:"If Low Water indicator is lit → check tap valve (under sink) + hand valve (back of unit) + hoses for kinks. Confirm 240V power plug is firmly connected.",ms:"Jika penunjuk Low Water menyala → periksa injap paip (bawah sinki) + injap tangan (belakang unit) + hos untuk bengkok. Sahkan palam kuasa 240V dipasang dengan kukuh.",zh:"如果Low Water指示灯亮起 → 检查水龙头阀（水槽下方）+ 手动阀（设备背面）+ 软管是否弯折。确认240V电源插头已牢固连接。",ne:"Low Water बत्ती बलेको भए → नल भल्भ (सिंक मुनि) + ह्यान्ड भल्भ (मेसिन पछाडि) + पाइप जाँच गर्नुहोस्। 240V प्लग जाँच गर्नुहोस्।",bn:"Low Water সূচক জ্বললে → ট্যাপ ভালভ (সিঙ্কের নিচে) + হ্যান্ড ভালভ (ইউনিটের পিছনে) + পাইপ পরীক্ষা করুন। 240V প্লাগ নিশ্চিত করুন।"},
sDone:{en:"3 LEDs on, hot water confirmed → inform guest ✓",ms:"3 LED menyala, air panas disahkan → maklumkan tetamu ✓",zh:"3个LED亮起，热水确认正常 → 通知客人 ✓",ne:"३ LED बलेको, तातो पानी ठीक → अतिथिलाई जानकारी दिनुहोस् ✓",bn:"৩ LED জ্বলছে, গরম পানি নিশ্চিত → অতিথিকে জানান ✓"},

scenTitle:{en:"Common Scenarios",ms:"Senario Biasa",zh:"常见场景",ne:"सामान्य अवस्थाहरू",bn:"সাধারণ পরিস্থিতি"},
complaint:{en:"Complaint",ms:"Aduan",zh:"投诉",ne:"गुनासो",bn:"অভিযোগ"},

scen1a:{en:"Check Hot Lock → unlock. Hot water = LEFT lever",ms:"Periksa Hot Lock → buka kunci. Air panas = tuil KIRI",zh:"检查热水锁→解锁。热水=左侧把手",ne:"Hot Lock जाँच गर्नुहोस् → खोल्नुहोस्। तातो पानी = बायाँ लिभर",bn:"Hot Lock পরীক্ষা → আনলক করুন। গরম পানি = বাম লিভার"},
scen2q:{en:"Was hot, now lukewarm",ms:"Tadi panas, sekarang suam sahaja",zh:"之前热现在变温了",ne:"पहिले तातो थियो, अहिले न्यानो",bn:"আগে গরম ছিল, এখন কুসুম গরম"},
scen2a:{en:"Tank depleted. Wait for 3 LEDs (10-20 min)",ms:"Tangki habis. Tunggu 3 LED menyala (10-20 minit)",zh:"水箱已排空。等3个LED亮起（10-20分钟）",ne:"ट्यांक खाली भयो। ३ LED बल्न पर्खनुहोस् (10-20 मिनेट)",bn:"ট্যাংক খালি। ৩ LED জ্বলার জন্য অপেক্ষা করুন (১০-২০ মিনিট)"},
scen3q:{en:"Keeps pressing, nothing happens",ms:"Terus menekan, tiada apa-apa berlaku",zh:"一直按但没反应",ne:"थिचिरहँदा पनि केही भएन",bn:"বারবার চাপছে, কিছু হচ্ছে না"},
scen3a:{en:"Auto-safety: switches to Ambient after 7 sec. Press Hot → push LEFT lever WITHIN 7 sec",ms:"Keselamatan auto: bertukar ke Ambient selepas 7 saat. Tekan Hot → tolak tuil KIRI DALAM 7 saat",zh:"自动安全：7秒后切换到常温。按Hot→7秒内推左把手",ne:"Auto-safety: ७ सेकेन्डपछि Ambient मा जान्छ। Hot थिच्नुहोस् → ७ सेकेन्डभित्र बायाँ लिभर",bn:"অটো-সেফটি: ৭ সেকেন্ড পর Ambient-এ যায়। Hot চাপুন → ৭ সেকেন্ডের মধ্যে বাম লিভার"},
scen4q:{en:"Hot button light went OFF",ms:"Lampu butang Hot padam sepenuhnya",zh:"Hot按钮灯完全灭了",ne:"Hot बटनको बत्ती निभ्यो",bn:"Hot বোতামের আলো নিভে গেছে"},
scen4a:{en:"Guest held 7+ sec (turned OFF). Hold Hot 3 sec to turn ON again",ms:"Tetamu tekan 7+ saat (dimatikan). Tahan Hot 3 saat untuk hidupkan semula",zh:"客人按了7+秒（已关闭）。按住Hot 3秒重新开启",ne:"अतिथिले ७+ सेकेन्ड थिच्यो (बन्द भयो)। Hot ३ सेकेन्ड थिचेर फेरि सुरु गर्नुहोस्",bn:"অতিথি ৭+ সেকেন্ড ধরেছে (বন্ধ হয়েছে)। Hot ৩ সেকেন্ড ধরে আবার চালু করুন"},
scen5q:{en:"White flakes in hot water",ms:"Kepingan putih dalam air panas",zh:"热水中有白色颗粒",ne:"तातो पानीमा सेतो टुक्रा",bn:"গরম পানিতে সাদা ফ্লেক"},
scen5a:{en:"Limescale — normal mineral buildup. Reassure guest. If severe → call 1800-88-111",ms:"Kerak kapur — penumpukan mineral biasa. Tenangkan tetamu. Jika teruk → hubungi 1800-88-111",zh:"水垢——正常矿物质沉积。安抚客人。严重时→致电 1800-88-111",ne:"खनिज जम्मा — सामान्य हो। अतिथिलाई भन्नुहोस्। गम्भीर भए → 1800-88-111",bn:"খনিজ জমা — স্বাভাবিক। অতিথিকে আশ্বস্ত করুন। গুরুতর হলে → 1800-88-111"},

// ═══ HELPERS ═══
function sec(n,title){return`<div class="sec-h"><div class="sec-num">${n}</div><h2>${title}</h2></div>`}
function al(type,icon,text){return`<div class="alert ${type}"><span class="ai">${icon}</span><div>${text}</div></div>`}
function stp(num,color,content,last){return`<div class="step"><div class="step-rail"><div class="step-circ" style="background:${color}">${num}</div>${last?'':'<div class="step-line"></div>'}</div><div class="step-card">${content}</div></div>`}
function yn(type,text){return`<div class="yn ${type}"><span class="tag">${type==='y'?'✓ YES':'✗ NO'}</span><span>${text}</span></div>`}
function lc(cls,label){return`<div class="led-card"><div class="dots"><div class="dot ${cls[0]}"></div><div class="dot ${cls[1]}"></div><div class="dot ${cls[2]}"></div></div><div class="desc">${label}</div></div>`}

function render(){
  document.getElementById('content').innerHTML=R[P]();
  document.getElementById('topbar-title').textContent=t(PAGES.find(p=>p.id===P)?.k||'navHome');
  document.getElementById('sb-nav').innerHTML=PAGES.map(p=>`<button class="sb-btn ${p.id===P?'active':''}" onclick="go('${p.id}')"><span class="icon">${p.icon}</span><span>${t(p.k)}</span></button>`).join('');
  const lb=Object.entries(LANGS).map(([k,v])=>`<button class="lbtn ${k===L?'active':''}" onclick="setLang('${k}')">${v}</button>`).join('');
  document.getElementById('sb-lang-btns').innerHTML=lb;
  document.getElementById('topbar-langs').innerHTML=Object.keys(LANGS).map(k=>`<button class="lbtn ${k===L?'active':''}" onclick="setLang('${k}')">${k.toUpperCase()}</button>`).join('');
}
function go(p){P=p;toggleMenu(false);render();window.scrollTo(0,0)}
function setLang(l){L=l;render()}
function toggleMenu(force){const sb=document.getElementById('sidebar'),ov=document.getElementById('overlay');const open=force!==undefined?force:!sb.classList.contains('open');sb.classList.toggle('open',open);ov.classList.toggle('show',open)}
render();

// Inject animation styles
let ess=document.createElement('style');ess.textContent=`
@keyframes rainDrop{0%{top:-30px;opacity:1}100%{top:110vh;opacity:0}}
@keyframes splashPop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
@keyframes dropFly{0%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy));opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes heatPulse{0%{box-shadow:0 0 0 rgba(232,85,58,0)}50%{box-shadow:0 0 25px rgba(232,85,58,.5)}100%{box-shadow:0 0 0 rgba(232,85,58,0)}}

// Konami Code → Water rain
let kSeq=[38,38,40,40,37,39,37,39,66,65],kBuf=[];
// Type tracker for "water"
let tBuf='';
document.addEventListener('keydown',e=>{
  kBuf.push(e.keyCode);if(kBuf.length>10)kBuf.shift();
  if(kBuf.join(',')==kSeq.join(','))waterRain();
  tBuf+=e.key.toLowerCase();if(tBuf.length>10)tBuf=tBuf.slice(-10);
  if(tBuf.includes('water')){tBuf='';waterSplash();}
});

function waterRain(){
  let c=document.createElement('div');
  c.style.cssText='position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;';
  document.body.appendChild(c);
  for(let i=0;i<50;i++){
    let d=document.createElement('div');
    d.textContent=['💧','💦','🌊','🫧'][~~(Math.random()*4)];
    d.style.cssText=`position:absolute;font-size:${14+Math.random()*24}px;left:${Math.random()*100}%;top:-30px;animation:rainDrop ${1.5+Math.random()*2}s ${Math.random()*1.5}s linear forwards;`;
    c.appendChild(d);
  }
  setTimeout(()=>c.remove(),5000);
  console.log('%c🌧️ KONAMI CODE! Water rain activated!','font-size:14px;color:#4A90D9;font-weight:bold;');
}

function waterSplash(){
  let c=document.createElement('div');
  c.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;pointer-events:none;font-size:100px;animation:splashPop .8s ease-out forwards;';
  c.textContent='💦';document.body.appendChild(c);
  for(let i=0;i<12;i++){
    let d=document.createElement('div');d.textContent='💧';
    let a=Math.random()*Math.PI*2,dist=80+Math.random()*120;
    d.style.cssText=`position:fixed;top:50%;left:50%;font-size:${16+Math.random()*20}px;z-index:9999;pointer-events:none;animation:dropFly .7s ${Math.random()*.2}s ease-out forwards;--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px;`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
  }
  setTimeout(()=>c.remove(),1000);
  console.log('%c💦 SPLASH! You typed "water"!','font-size:14px;color:#4A90D9;font-weight:bold;');
}

// Click Hot button on panel → heat glow effect
document.addEventListener('click',e=>{
  let btn=e.target.closest('.pb');
  if(!btn)return;
  let lbl=btn.querySelector('.lbl');
  if(lbl&&lbl.textContent.includes('Hot')&&!lbl.textContent.includes('Lock')){
    btn.style.animation='heatPulse .8s ease';
    setTimeout(()=>btn.style.animation='',900);
  }
});

// Mobile shake → water rain
let sX=0,sY=0,sZ=0,sCt=0,sLast=0;
window.addEventListener('devicemotion',e=>{
  let a=e.accelerationIncludingGravity;if(!a)return;
  let now=Date.now();if(now-sLast<100)return;sLast=now;
  let d=Math.abs(a.x-sX)+Math.abs(a.y-sY)+Math.abs(a.z-sZ);
  sX=a.x;sY=a.y;sZ=a.z;
  if(d>30){sCt++;if(sCt>=3){sCt=0;waterRain();}}
  else{sCt=0;}
});
